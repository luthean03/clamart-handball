name: Mise à jour des résultats

on:
  schedule:
    # Horaires en UTC (Paris = UTC+1 l'hiver, UTC+2 l'été)
    - cron: "15 5 * * *"           # tous les jours vers 7 h
    - cron: "*/30 12-21 * * 6,0"   # samedi et dimanche, toutes les 30 min de ~14 h à ~23 h
  workflow_dispatch:                # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths: ["site/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            collecteur/requirements.txt
            collecteur/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r collecteur/requirements-dev.txt

      - name: Tests du collecteur
        run: python -m pytest collecteur/tests -q

      - name: Récupérer les données sur ffhandball.fr
        if: github.event_name != 'push'
        run: python collecteur/collecte.py

      - name: Enregistrer les nouvelles données
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data collecteur/cache
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données FFHB du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
