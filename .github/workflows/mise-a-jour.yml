name: Mise à jour des résultats

on:
  schedule:
    # Horaires en UTC (Paris = UTC+1 l'hiver, UTC+2 l'été)
    - cron: "15 5 * * *"           # tous les jours vers 7 h
    - cron: "*/30 12-21 * * 6,0"   # samedi et dimanche, toutes les 30 min de ~14 h à ~23 h
    - cron: "45 15 * * *"         # tous les jours vers 17 h 45 (été) / 16 h 45 (hiver) : rappels et matchs de semaine
    - cron: "47 8 * * 1-5"         # lundi au vendredi vers 10 h 47 (été) / 9 h 47 (hiver)
    - cron: "47 10 * * 1-5"        # lundi au vendredi vers 12 h 47 (été) / 11 h 47 (hiver)
    - cron: "47 18 * * 1-5"        # lundi au vendredi vers 20 h 47 (été) / 19 h 47 (hiver)
    - cron: "47 20 * * 1-5"        # lundi au vendredi vers 22 h 47 (été) / 21 h 47 (hiver) : résultats des matchs de semaine
  workflow_dispatch:
    inputs:
      test_sujet:
        description: "Optionnel : id d'équipe (ex. seniors-f-1) pour envoyer une notification de test"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # la tête de branche, pas le SHA du déclenchement (un passage en file pousserait sur une base périmée)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            collecteur/requirements.txt
            collecteur/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r collecteur/requirements-dev.txt

      - name: Tests du collecteur
        run: python -m pytest collecteur/tests -q

      - name: Récupérer les données sur ffhandball.fr
        if: github.event_name != 'push'
        run: python collecteur/collecte.py

      - name: Images des notifications
        if: github.event_name != 'push'
        continue-on-error: true      # un échec du notifieur ne bloque pas la publication des scores
        env:
          TEST_SUJET: ${{ inputs.test_sujet }}
        run: |
          if [ -n "$TEST_SUJET" ]; then
            python collecteur/notifieur.py --images --test "$TEST_SUJET"
          else
            python collecteur/notifieur.py --images
          fi

      - name: Enregistrer les nouvelles données
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p site/notifs
          git add site/data site/notifs collecteur/cache
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données FFHB du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

  notifications:
    needs: publication
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # la tête de branche, qui contient le commit du job collecte

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            collecteur/requirements.txt
            collecteur/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r collecteur/requirements.txt

      - name: Envoyer les notifications
        # Pas de continue-on-error : un échec d'envoi rend l'exécution rouge (e-mail GitHub au propriétaire).
        # La publication Pages est un job amont déjà terminé : elle n'est jamais bloquée par cette étape.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_SUJET: ${{ inputs.test_sujet }}
        run: |
          if [ -n "$TEST_SUJET" ]; then
            python collecteur/notifieur.py --test "$TEST_SUJET"
          else
            python collecteur/notifieur.py
          fi

      - name: Enregistrer le registre des envois
        if: always() && github.event_name != 'push'      # même après un échec ou une annulation : les envois réussis restent marqués
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p collecteur/etat
          git add collecteur/etat
          if git diff --cached --quiet; then
            echo "Registre inchangé."
          else
            git commit -m "Notifications du $(date -u +'%Y-%m-%d %H:%M') UTC"
            for essai in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep $((essai * 5))
            done
            echo "::error::Le registre des envois n'a pas pu être poussé (risque de doublons au prochain passage)"
            exit 1
          fi
